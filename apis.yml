aid: pgvector
name: pgvector
description: >-
  pgvector is an open-source PostgreSQL extension for vector similarity search,
  created and maintained by Andrew Kane. It adds vector, halfvec and sparsevec data
  types, six distance operators (L2, inner product, cosine, L1, Hamming, Jaccard) and
  two approximate-nearest-neighbour index access methods (HNSW and IVFFlat) to a
  Postgres server, so embeddings live beside the rest of an application's data with
  full ACID semantics, JOINs, point-in-time recovery and existing backup and
  replication tooling. It is not a service and exposes no HTTP API: the interface is
  SQL, the contract is the extension's own installation DDL, and consumers reach it
  through an ordinary Postgres driver. The project also publishes first-party client
  libraries for seventeen languages, which handle vector encoding for each language's
  Postgres driver.

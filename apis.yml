x-coverage:
  state: covered
  detail: >-
    pgvector is a PostgreSQL extension, not a service. Its contract is the SQL DDL the
    server executes at CREATE EXTENSION time, which was found, fetched and captured;
    the absence of an OpenAPI is inapplicability, not an omission. The one genuine gap
    in the project's own posture is the missing SECURITY.md - probed 404 on both the
    repository and the organization .github repository - which leaves no published
    coordinated disclosure channel for a project whose last three releases each fixed
    a memory-safety or index-corruption defect running inside the database backend.
  evidence:
  - url: https://raw.githubusercontent.com/pgvector/pgvector/master/sql/vector.sql
    status: 200
  - url: https://raw.githubusercontent.com/pgvector/pgvector/master/SECURITY.md

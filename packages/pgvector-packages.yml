name: pgvector Client Libraries
description: >-
  First-party pgvector client libraries and example repositories, published by the
  pgvector project (Andrew Kane) under github.com/pgvector. pgvector itself is a
  PostgreSQL extension with no HTTP API; these libraries add vector type encoding /
  decoding and ORM integration on top of each language's existing Postgres driver.
generated: '2026-08-27'
method: searched
source: >-
  https://github.com/pgvector/pgvector#languages plus each package's own registry
  metadata endpoint (registry.npmjs.org, pypi.org, rubygems.org, crates.io,
  repo.packagist.org, proxy.golang.org, api.nuget.org, search.maven.org, hex.pm,
  pub.dev, hackage.haskell.org, JuliaRegistries/General, nim-lang/packages),
  queried 2026-08-27.
notes: >-
  The pgvector README distinguishes "libraries" (a real published package) from
  "examples" (a repository of sample code with no distributable artifact). Only the
  library repositories are listed here; the examples-only repositories are recorded
  under examples_only[] so the distinction stays legible. Maven Central is the
  clearest decay signal in this set: com.pgvector:pgvector last published 0.1.6 on
  2024-07-17, more than two years before the extension's current 0.8.6 release.

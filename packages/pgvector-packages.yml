third_party:
  note: >-
    Named in the pgvector README but maintained outside the pgvector organization.
  packages:
  - name: neighbor
    language: Ruby
    official: false
    url: https://github.com/ankane/neighbor
    note: Rails nearest-neighbor integration by the same author, in a personal namespace.
distributions:
  note: >-
    The extension itself, as shipped. These are how a consumer actually gets pgvector
    onto a server; the packages[] above are language bindings that assume it is already
    installed.
  entries:
  - name: vector
    registry: pgxn
    kind: postgres-extension
    official: true
    url: https://pgxn.org/dist/vector
    version: 0.8.6
    published: '2026-07-29'
    maintainer: Andrew Kane
    note: >-
      PostgreSQL Extension Network distribution, installed with `pgxn install vector`.
      Version and date read from https://api.pgxn.org/dist/vector.json on 2026-08-27.
  - name: pgvector/pgvector
    registry: docker-hub
    kind: container-image
    official: true
    url: https://hub.docker.com/r/pgvector/pgvector
    version: 0.8.6
    published: '2026-07-29'
    note: >-
      Tagged per Postgres major and Debian base - pg13 through pg18, bookworm and
      trixie - both floating (pg18) and pinned (0.8.6-pg18). Version tracks the
      extension release; the date is that release's date.
  - name: postgresql-<pgmajor>-pgvector
    registry: postgresql-apt
    kind: os-package
    official: false
    url: https://wiki.postgresql.org/wiki/Apt
    version: null
    published: null
    note: >-
      Built and published by the PostgreSQL APT repository, not by the pgvector
      project. Version lags upstream by whatever the distribution maintainers ship, and
      the repository publishes no per-package metadata endpoint this pipeline queries -
      recorded as null rather than guessed.
  - name: pgvector_<pgmajor>
    registry: postgresql-yum
    kind: os-package
    official: false
    url: https://yum.postgresql.org/
    version: null
    published: null
    note: Same as APT - packaged downstream, no queried metadata endpoint.
  other_channels:
    note: >-
      Named in the README's installation section but not first-party distributions.
    channels: [homebrew, conda-forge, FreeBSD pkg, Alpine apk, Postgres.app]

tooling:
- name: setup-pgvector
  kind: github-action
  official: true
  url: https://github.com/pgvector/setup-pgvector
  note: >-
    Installation instructions for GitHub Actions runners. Not published to the GitHub
    Marketplace as a versioned action at time of probe.

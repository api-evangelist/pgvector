name: pgvector Plans and Pricing
description: >-
  pgvector publishes no plans, no pricing and no commercial tier. It is a free,
  open-source PostgreSQL extension under the PostgreSQL License, with no hosted
  service, no paid support offering and no sponsorship or funding page.
generated: '2026-08-27'
method: searched
source: https://github.com/pgvector/pgvector
plan_count: 0
